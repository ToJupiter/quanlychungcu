# Server Configuration
server.port=3001
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mydb2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=SafePass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration  
app.jwt.secret=your_very_secure_jwt_secret_key_that_is_long_enough_for_hmac_sha256_algorithm_bluemoon
app.jwt.expiration=86400000

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.bluemoon=DEBUG

# Jackson Configuration for JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=UTC

# Environment
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development} 